name: Proxy MCII Auto Checkin

on:
  schedule:
    # 每天 UTC 00:00（即北京时间 08:00）自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动点击触发运行
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行自动签到
        env:
          USER_COOKIE: ${{ secrets.USER_COOKIE }}
        run: |
          python checkin.py
